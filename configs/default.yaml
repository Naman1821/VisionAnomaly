# VisionAnomaly — default config (MVTec-AD)
seed: 42
device: auto  # auto | cuda | cpu | mps

data:
  root: data/mvtec
  category: bottle  # e.g. bottle, cable, capsule — start small for quick runs
  image_size: 256
  train_batch_size: 8
  test_batch_size: 1
  num_workers: 4

model:
  name: patchcore  # patchcore | padim
  backbone: wide_resnet50_2
  layers: [layer2, layer3]
  # PatchCore
  coreset_sampling_ratio: 0.1
  num_neighbors: 9
  # PaDiM
  padim_dim: 100

train:
  max_train_samples: null  # null = all normal train images

eval:
  output_dir: outputs
  save_heatmaps: true
  max_heatmap_samples: 32
